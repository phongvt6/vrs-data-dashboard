name: Collect schema

# Kéo schema từ các nguồn đã bật trong scripts/sources.json, merge vào
# catalog.json, và tự commit nếu có thay đổi. Vercel sẽ tự deploy commit đó.
#
# Cần khai báo Secrets ở GitHub (Settings → Secrets and variables → Actions),
# tương ứng nguồn nào đang bật:
#   SUPABASE_DB_URL, BQ_PROJECT, BQ_DATASET, GCP_SA_KEY,
#   AIRTABLE_TOKEN, AIRTABLE_BASE, SHEETS_ID_KPI
# GCP_SA_KEY = nội dung JSON service account (cho BigQuery và/hoặc Sheets).

on:
  schedule:
    - cron: "0 22 * * *" # 22:00 UTC ~ 05:00 giờ VN mỗi ngày
  workflow_dispatch: {} # cho phép chạy tay từ tab Actions

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cài driver cho collector
        run: npm i --no-save pg @google-cloud/bigquery google-auth-library

      - name: Ghi service account key (nếu có)
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa.json" >> "$GITHUB_ENV"
          fi
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Collect + validate
        run: npm run collect
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BQ_PROJECT: ${{ secrets.BQ_PROJECT }}
          BQ_DATASET: ${{ secrets.BQ_DATASET }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          SHEETS_ID_KPI: ${{ secrets.SHEETS_ID_KPI }}

      - name: Commit nếu catalog thay đổi
        run: |
          if ! git diff --quiet -- src/data/catalog.json; then
            git config user.name "schema-bot"
            git config user.email "schema-bot@users.noreply.github.com"
            git add src/data/catalog.json
            git commit -m "chore(catalog): tự động cập nhật schema [skip ci]"
            git push
          else
            echo "Không có thay đổi schema."
          fi
